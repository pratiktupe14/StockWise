version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockwise-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stockwise-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockwise-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockwise-net

networks:
  stockwise-net:
    driver: bridge
